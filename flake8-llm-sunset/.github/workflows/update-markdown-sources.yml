name: Update Markdown sources

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: update-markdown-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download Markdown sources
        run: python scripts/fetch_markdown_sources.py

      - name: Open an issue when sources change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- sources/google-cloud)" ]]; then
            echo "Upstream sources are unchanged."
            exit 0
          fi

          issue_title="Upstream Markdown sources changed"
          open_issue_count="$(
            gh issue list \
              --state open \
              --json title \
              --jq "map(select(.title == \"$issue_title\")) | length"
          )"
          if [[ "$open_issue_count" != "0" ]]; then
            echo "An open notification issue already exists."
            exit 0
          fi

          changed_files="$(git diff --name-only -- sources/google-cloud)"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "$issue_title" \
            --body "$(printf '%s\n\n%s\n\n```text\n%s\n```' \
              'The upstream model documentation differs from the repository snapshots.' \
              "Review the source changes and update the package as needed: $run_url" \
              "$changed_files")"
